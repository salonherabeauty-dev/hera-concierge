name: Fix structured-output extraction failover

on:
  push:
    branches:
      - fix/structured-output-extraction-failover

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/structured-output-extraction-failover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Force output extraction inside model failover boundary
        run: python3 scripts/fix_structured_output_extraction.py
      - name: Install locked dependencies
        run: npm ci
      - name: Strict type check, build and complete automated suite
        run: npm test
      - name: Credential scan
        run: npm run credential:scan
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify clean implementation
        run: |
          git diff --check
          test "$(grep -c 'void generated.output;' src/ai/receptionist.ts)" -eq 3
      - name: Remove one-time tooling and commit verified implementation
        run: |
          rm scripts/fix_structured_output_extraction.py
          rm .github/workflows/fix-structured-output-extraction-failover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Catch lazy structured-output failures inside model failover'
          git push origin HEAD:fix/structured-output-extraction-failover
