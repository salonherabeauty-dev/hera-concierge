name: Finalise merged Stage 2 evidence

on:
  push:
    branches:
      - feat/hera-ai-receptionist-foundation

permissions:
  contents: write
  deployments: read

concurrency:
  group: finalise-merged-stage2-evidence
  cancel-in-progress: false

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hera-ai-receptionist-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Stage 2 is merged, clean and release-locked
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const gate = JSON.parse(fs.readFileSync('governance/pre-production-gates.json','utf8'));
          const stage2 = gate.gates.find((item) => item.id === 'stage_2_knowledge_and_action_authority');
          if (!stage2 || stage2.status !== 'passed' || stage2.blockers.length !== 0) {
            throw new Error('Stage 2 gate is not passed');
          }
          if (gate.liveProductionApproved !== false || gate.shadowModeRequired !== true) {
            throw new Error('Release lock changed unexpectedly');
          }
          const constitution = JSON.parse(fs.readFileSync('governance/hera-service-constitution.json','utf8'));
          if (constitution.version !== 'hera-service-constitution-2026-08-25.1') {
            throw new Error('Constitution version mismatch');
          }
          const contracts = JSON.parse(fs.readFileSync('governance/action-authority-contracts.json','utf8'));
          if (contracts.contracts.length !== 25) throw new Error('Action contract count mismatch');
          const claims = JSON.parse(fs.readFileSync('governance/knowledge-authority-catalog.json','utf8'));
          if (claims.canonicalClaims.length !== 9) throw new Error('Claim count mismatch');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          if (pkg.scripts.postbuild) throw new Error('Temporary postbuild remains');
          for (const path of [
            'tools/stage2-preview-certification.ts',
            '.github/workflows/finalise-stage2-preview-proof.yml',
            '.github/workflows/certify-stage2-code.yml',
            '.github/workflows/finalise-stage2-contracts.yml',
            '.github/workflows/apply-stage2-runtime-authority.yml'
          ]) {
            if (fs.existsSync(path)) throw new Error(`temporary Stage 2 file remains: ${path}`);
          }
          NODE
      - name: Run full clean verification
        run: |
          npm ci
          npm run typecheck
          npm run build
          git diff --exit-code -- public/command-centre/
          npm run test:unit
          npm run credential:scan
          npm audit --omit=dev --audit-level=high
      - name: Wait for successful protected Vercel Preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'hera-stage2-merged-evidence',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          repo = os.environ['REPOSITORY']
          commit = os.environ['COMMIT_SHA']
          proof = None
          for _ in range(80):
              deployments = get(f'https://api.github.com/repos/{repo}/deployments?sha={commit}&per_page=20')
              for deployment in deployments:
                  creator = ((deployment.get('creator') or {}).get('login') or '').lower()
                  environment = str(deployment.get('environment') or '').lower()
                  if 'vercel' not in creator and 'preview' not in environment:
                      continue
                  statuses = get(deployment['statuses_url'])
                  if not statuses:
                      continue
                  latest = statuses[0]
                  state = latest.get('state')
                  url = latest.get('environment_url')
                  if state in {'failure','error','inactive'}:
                      raise SystemExit(f'merged Stage 2 Vercel deployment failed: {state}')
                  if state == 'success' and url:
                      proof = {
                          'commit': commit,
                          'githubDeploymentId': deployment.get('id'),
                          'url': url,
                          'state': state,
                      }
                      break
              if proof:
                  break
              time.sleep(8)
          if not proof:
              raise SystemExit('timed out waiting for merged Stage 2 Vercel deployment')
          if 'hera-concierge' not in proof['url']:
              raise SystemExit('unexpected deployment URL')
          Path('/tmp/stage2-merged-proof.json').write_text(json.dumps(proof, indent=2) + '\n')
          print('STAGE2_MERGED_PROOF', json.dumps(proof))
          PY
      - name: Record merged Stage 2 deployment and remove commencement placeholder
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('/tmp/stage2-merged-proof.json').read_text())
          gate_path = Path('governance/pre-production-gates.json')
          register = json.loads(gate_path.read_text())
          register['version'] = '2026-08-25.5'
          stage2 = next(item for item in register['gates'] if item['id'] == 'stage_2_knowledge_and_action_authority')
          stage2['evidence']['mergedBranchVerificationCommit'] = proof['commit']
          stage2['evidence']['mergedBranchGithubDeploymentId'] = proof['githubDeploymentId']
          stage2['evidence']['mergedBranchDeploymentUrl'] = proof['url']
          stage2['evidence']['mergedBranchDeploymentState'] = proof['state']
          stage2['evidence']['mergedBranchFullVerification'] = 'passed'
          gate_path.write_text(json.dumps(register, indent=2) + '\n')

          evidence_path = Path('docs/STAGE_2_KNOWLEDGE_ACTION_AUTHORITY_EVIDENCE.md')
          text = evidence_path.read_text().rstrip()
          text += f'''\n\n## Merged authoritative staging proof\n\n```text\nAuthoritative verification commit: {proof['commit']}\nGitHub deployment ID:             {proof['githubDeploymentId']}\nProtected Preview URL:            {proof['url']}\nDeployment state:                 {proof['state']}\nFull merged-branch verification:  passed\nWhatsApp provider sends:          0\nProduction touched:               no\n```\n\nThe authoritative branch remained shadow-only and live Production remained locked.\n'''
          evidence_path.write_text(text)
          PY
          rm -f docs/STAGE_2_INIT.md
          rm -f .github/workflows/finalise-stage2-merged-evidence.yml
      - name: Commit final Stage 2 merged evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/pre-production-gates.json docs/STAGE_2_KNOWLEDGE_ACTION_AUTHORITY_EVIDENCE.md docs .github/workflows
          git commit -m "Record merged Stage 2 certification evidence"
          git push origin HEAD:feat/hera-ai-receptionist-foundation
