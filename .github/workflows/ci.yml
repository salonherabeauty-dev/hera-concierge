name: Hera receptionist verification

on:
  push:
    branches:
      - feat/hera-ai-receptionist-foundation
      - feat/360dialog-coexistence-adapter
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Strict TypeScript validation
        run: npm run typecheck
      - name: Exact Vercel deployment build
        run: npm run build
      - name: Verify generated Command Centre assets are committed
        run: git diff --exit-code -- public/command-centre
      - name: Complete automated suite
        run: npm run test:unit
      - name: Credential scan
        run: npm run credential:scan
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
