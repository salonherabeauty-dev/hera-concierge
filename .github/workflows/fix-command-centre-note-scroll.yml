name: Fix Command Centre note interaction

on:
  push:
    branches:
      - fix/command-centre-note-scroll
    paths:
      - scripts/fix_command_centre_note_scroll.py
      - .github/workflows/fix-command-centre-note-scroll.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/command-centre-note-scroll
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply note interaction and scroll-preservation fix
        run: python3 scripts/fix_command_centre_note_scroll.py
      - name: Install locked dependencies
        run: npm ci
      - name: Strict type check, Command Centre build and automated suite
        run: npm test
      - name: Credential scan
        run: npm run credential:scan
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify clean patch
        run: git diff --check
      - name: Remove one-time patcher and commit verified changes
        run: |
          rm scripts/fix_command_centre_note_scroll.py
          rm .github/workflows/fix-command-centre-note-scroll.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Command Centre note editor scroll reset"
          git push origin HEAD:fix/command-centre-note-scroll
