name: Apply curly service quality gate

on:
  push:
    branches:
      - feat/curly-service-quality-gate
    paths:
      - scripts/apply_curly_service_quality_gate.py
      - .github/workflows/apply-curly-service-quality-gate.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/curly-service-quality-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic curly service quality gate
        run: python3 scripts/apply_curly_service_quality_gate.py
      - name: Install locked dependencies
        run: npm ci
      - name: Strict type check and complete automated suite
        run: npm test
      - name: Credential scan
        run: npm run credential:scan
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify clean patch
        run: git diff --check
      - name: Remove one-time patcher and commit verified changes
        run: |
          rm scripts/apply_curly_service_quality_gate.py
          rm .github/workflows/apply-curly-service-quality-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Answer verified curly service questions directly"
          git push origin HEAD:feat/curly-service-quality-gate
