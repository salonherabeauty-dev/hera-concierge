name: Hydrate Command Centre source

on:
  push:
    branches:
      - feat/command-centre-foundation
    paths:
      - ".command-centre-payload/**"
      - ".github/workflows/hydrate-command-centre.yml"

permissions:
  contents: write

concurrency:
  group: hydrate-command-centre
  cancel-in-progress: false

jobs:
  hydrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat .command-centre-payload/part-* | base64 --decode > /tmp/command-centre-src.tar.gz
          echo "2fbabdb41ac75c1644395f57c3a36dad08b0f1d097bf88173becf1c740e8c27e  /tmp/command-centre-src.tar.gz" | sha256sum --check -
          tar -xzf /tmp/command-centre-src.tar.gz
          rm -rf .command-centre-payload
          rm -f .github/workflows/hydrate-command-centre.yml
      - name: Commit hydrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add secure Hera AI Command Centre foundation"
          git push origin HEAD:feat/command-centre-foundation
