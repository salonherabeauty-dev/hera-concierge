name: Finalise Stage 2 authority contracts

on:
  push:
    branches:
      - feat/stage-2-knowledge-action-authority

permissions:
  contents: write

concurrency:
  group: finalise-stage2-authority-contracts
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage-2-knowledge-action-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Finalise runtime and migration contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/governance/actionAuthority.ts')
          text = runtime.read_text()
          if 'actionKey: "confirm_booking_outcome"' not in text:
              anchor = '''  {
              actionKey: "complaint_review",'''
              block = '''  {
              actionKey: "confirm_booking_outcome",
              authority: "human_required",
              owner: "receptionist",
              taskType: "booking_action",
              clientRule:
                "Confirm only after Timely success or an authorised human outcome; the request itself is never proof of completion.",
            },
            {
              actionKey: "complaint_review",'''
              if text.count(anchor) != 1:
                  raise SystemExit('runtime confirmation contract anchor not unique')
              text = text.replace(anchor, block)
              runtime.write_text(text)

          migration = Path('supabase/migrations/20260825000001_certify_knowledge_action_authority.sql')
          sql = migration.read_text()
          sql = sql.replace(
              "encode(digest(authority_body.body, 'sha256'), 'hex')",
              "md5(authority_body.body)",
          )
          migration.write_text(sql)

          search = Path('src/knowledge/search.ts')
          source = search.read_text()
          action_import = 'import { renderActionAuthorityPrompt } from "../governance/actionAuthority.js";\n'
          knowledge_import = 'import { orderKnowledgeByAuthority } from "../governance/knowledgeAuthority.js";\n'
          anchor = 'import type { KnowledgeResult } from "../types.js";\n'
          if action_import not in source:
              if source.count(anchor) != 1:
                  raise SystemExit('knowledge import anchor not unique')
              source = source.replace(anchor, anchor + action_import + knowledge_import)
          old_static = '''const STATIC_SECTIONS = [
            ...splitApprovedKnowledge(HERA_OPERATOR_POLICIES),
            ...splitApprovedKnowledge(),
          ];'''
          new_static = '''const STATIC_SECTIONS = [
            ...splitApprovedKnowledge(
              `${HERA_OPERATOR_POLICIES}\\n\\n${renderActionAuthorityPrompt()}`,
            ),
            ...splitApprovedKnowledge(),
          ];'''
          if old_static in source:
              source = source.replace(old_static, new_static)
          if 'renderActionAuthorityPrompt()' not in source:
              raise SystemExit('runtime action authority prompt not integrated')
          old_return = '  return [...merged.values()].sort((a, b) => b.score - a.score).slice(0, limit);'
          new_return = '  return orderKnowledgeByAuthority([...merged.values()], limit);'
          if old_return in source:
              source = source.replace(old_return, new_return)
          if new_return not in source:
              raise SystemExit('runtime authority ordering not integrated')
          search.write_text(source)
          PY
      - name: Verify repository
        run: |
          npm ci
          npm test
          npm run credential:scan
          npm audit --omit=dev --audit-level=high
      - name: Remove one-time workflows and commit
        run: |
          rm -f .github/workflows/finalise-stage2-contracts.yml
          rm -f .github/workflows/apply-stage2-runtime-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/governance/actionAuthority.ts src/knowledge/search.ts supabase/migrations/20260825000001_certify_knowledge_action_authority.sql .github/workflows
          git commit -m "Finalise Stage 2 runtime knowledge and action authority"
          git push origin HEAD:feat/stage-2-knowledge-action-authority
