name: Apply automatic human handoff engine

on:
  push:
    branches:
      - feat/automatic-human-handoff
    paths:
      - scripts/apply-automatic-handoff.py
      - .github/workflows/apply-automatic-handoff.yml
  pull_request:
    branches:
      - feat/hera-ai-receptionist-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated handoff branch
        uses: actions/checkout@v4
        with:
          ref: feat/automatic-human-handoff
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply reviewed source transformation
        run: python3 scripts/apply-automatic-handoff.py

      - name: Keep model evaluation verifier context complete
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/run-model-evals.ts")
          source = path.read_text()
          old = """    const verification = await verifyReceptionistDecision({
                originalMessage: scenario.message,
                decision: generated.decision,
          """
          new = """    const verification = await verifyReceptionistDecision({
                originalMessage: scenario.message,
                history,
                decision: generated.decision,
          """
          if old not in source:
              raise SystemExit("model evaluation verifier call did not match the reviewed source")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Strict type check, build and full test suite
        run: npm test

      - name: Credential scan
        run: npm run credential:scan

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build automatic human handoff engine

          Add verified structured handoff planning, deterministic H1-H4 routing, idempotent task persistence, booking readiness checks, client acknowledgement safeguards, Command Centre task visibility and regression coverage. Keep WhatsApp delivery in shadow mode and Production untouched."
          git push origin HEAD:feat/automatic-human-handoff
