name: Refine automatic human handoff engine

on:
  pull_request:
    branches:
      - feat/hera-ai-receptionist-foundation

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated handoff branch
        uses: actions/checkout@v4
        with:
          ref: feat/automatic-human-handoff
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic hardening refinements
        run: python3 scripts/refine-automatic-handoff.py

      - name: Align the handoff policy-version regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/automaticHandoff.test.ts")
          source = path.read_text()
          old = 'assert.equal(HUMAN_HANDOFF_POLICY_VERSION, "hera-human-handoff-1.0.0");'
          new = 'assert.equal(HUMAN_HANDOFF_POLICY_VERSION, "hera-human-handoff-1.1.0");'
          if old not in source:
              raise SystemExit("handoff policy-version assertion did not match the reviewed source")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Strict type check, build and complete automated suite
        run: npm test

      - name: Credential scan
        run: npm run credential:scan

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden automatic human handoff boundaries

          Fail closed on rejected verifier output, canonicalize Hera outlets, distinguish urgent from emergency safety cases, prevent optional booking fields from blocking reception, serialize concurrent task creation, preserve collected facts and add priority SLA coverage."
          git fetch origin feat/automatic-human-handoff
          git rebase origin/feat/automatic-human-handoff
          git push origin HEAD:feat/automatic-human-handoff
