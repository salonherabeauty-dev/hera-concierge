name: Website Concierge public release gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "api/website-concierge/**"
      - "src/website-concierge/**"
      - "supabase/migrations/20260902090000_create_website_concierge_staging_v1.sql"
      - "tests/websiteConciergePublicRelease.test.ts"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/website-concierge-public-proof.yml"
  push:
    branches:
      - main
    paths:
      - "api/website-concierge/**"
      - "src/website-concierge/**"
      - "supabase/migrations/20260902090000_create_website_concierge_staging_v1.sql"
      - "tests/websiteConciergePublicRelease.test.ts"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/website-concierge-public-proof.yml"

permissions:
  contents: read

concurrency:
  group: website-concierge-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  prove:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://hera-concierge.vercel.app
      HERA_ORIGIN: https://www.herabeauty.sg
    steps:
      - name: Wait for the frozen public backend deployment
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 72); do
            code="$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$BASE_URL/api/website-concierge/health" || true)"
            if [ "$code" = "200" ] \
              && jq -e '.ok == true' /tmp/health.json >/dev/null \
              && jq -e '.version == "hera-website-concierge-adapter-1.0.1"' /tmp/health.json >/dev/null \
              && jq -e '.modelId == "openai/gpt-5.6-sol"' /tmp/health.json >/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = "1"
          jq '{ok,version,exactCommit,modelId,reasoningEffort,maximumContentCalls,sessionsSeparatedFromWhatsApp,automaticWhatsAppSendAllowed,timelyWriteAllowed}' /tmp/health.json

      - name: Prove exact Hera-origin CORS preflight
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 \
            -D /tmp/preflight.headers \
            -o /tmp/preflight.body \
            -w '%{http_code}' \
            -X OPTIONS \
            -H "Origin: $HERA_ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,x-hera-website-session' \
            "$BASE_URL/api/website-concierge/session")"
          echo "preflight_status=$code"
          test "$code" = "204"
          python - <<'PY'
          from pathlib import Path
          headers = {}
          for line in Path('/tmp/preflight.headers').read_text().splitlines():
              if ':' in line:
                  key, value = line.split(':', 1)
                  headers[key.strip().lower()] = value.strip()
          assert headers.get('access-control-allow-origin') == 'https://www.herabeauty.sg', headers
          assert 'post' in headers.get('access-control-allow-methods', '').lower(), headers
          allowed = headers.get('access-control-allow-headers', '').lower().replace(' ', '')
          assert 'content-type' in allowed, headers
          assert 'x-hera-website-session' in allowed, headers
          print('PREFLIGHT_PASS')
          PY

      - name: Create one separate anonymous website session
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 \
            -D /tmp/session.headers \
            -o /tmp/session.json \
            -w '%{http_code}' \
            -X POST \
            -H "Origin: $HERA_ORIGIN" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "$BASE_URL/api/website-concierge/session")"
          echo "session_status=$code"
          test "$code" = "201"
          python - <<'PY'
          from pathlib import Path
          headers = {}
          for line in Path('/tmp/session.headers').read_text().splitlines():
              if ':' in line:
                  key, value = line.split(':', 1)
                  headers[key.strip().lower()] = value.strip()
          assert headers.get('access-control-allow-origin') == 'https://www.herabeauty.sg', headers
          PY
          jq -e '.ok == true' /tmp/session.json >/dev/null
          jq -e '.version == "hera-website-concierge-adapter-1.0.1"' /tmp/session.json >/dev/null
          jq -e '.automaticWhatsAppSendAllowed == false' /tmp/session.json >/dev/null
          jq -e '.timelyWriteAllowed == false' /tmp/session.json >/dev/null
          SESSION_ID="$(jq -er '.sessionId' /tmp/session.json)"
          SESSION_TOKEN="$(jq -er '.sessionToken' /tmp/session.json)"
          test -n "$SESSION_ID"
          test -n "$SESSION_TOKEN"
          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"
          echo "SESSION_TOKEN=$SESSION_TOKEN" >> "$GITHUB_ENV"
          echo "Synthetic website session: $SESSION_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove one live GPT-5.6 Sol website answer
        run: |
          set -euo pipefail
          BODY="$(jq -n \
            --arg sessionId "$SESSION_ID" \
            --arg message "I am considering a curly haircut. Which Hera specialist may suit me, what is the published price range, and does the answer differ between Tanglin Mall and Sentosa Cove?" \
            '{sessionId:$sessionId,message:$message}')"
          code="$(curl -sS -N --max-time 300 \
            -D /tmp/message.headers \
            -o /tmp/stream.txt \
            -w '%{http_code}' \
            -X POST \
            -H "Origin: $HERA_ORIGIN" \
            -H 'Content-Type: application/json' \
            -H "X-Hera-Website-Session: $SESSION_TOKEN" \
            -d "$BODY" \
            "$BASE_URL/api/website-concierge/message")"
          echo "message_status=$code"
          test "$code" = "200"
          python - <<'PY'
          from pathlib import Path
          headers = {}
          for line in Path('/tmp/message.headers').read_text().splitlines():
              if ':' in line:
                  key, value = line.split(':', 1)
                  headers[key.strip().lower()] = value.strip()
          assert headers.get('access-control-allow-origin') == 'https://www.herabeauty.sg', headers
          assert headers.get('content-type', '').lower().startswith('text/event-stream'), headers
          PY
          grep -q '^event: status' /tmp/stream.txt
          grep -q '^event: meta' /tmp/stream.txt
          grep -q '^event: delta' /tmp/stream.txt
          grep -q '^event: actions' /tmp/stream.txt
          grep -q '^event: done' /tmp/stream.txt
          ! grep -q '^event: error' /tmp/stream.txt
          python - <<'PY'
          import json
          from pathlib import Path

          raw = Path('/tmp/stream.txt').read_text()
          reply = []
          meta = {}
          done = {}
          for block in raw.split('\n\n'):
              event = None
              data = []
              for line in block.splitlines():
                  if line.startswith('event:'):
                      event = line[6:].strip()
                  elif line.startswith('data:'):
                      data.append(line[5:].strip())
              if not event or not data:
                  continue
              payload = json.loads('\n'.join(data))
              if event == 'delta':
                  reply.append(payload.get('text', ''))
              elif event == 'meta':
                  meta = payload
              elif event == 'done':
                  done = payload

          text = ''.join(reply).strip()
          assert len(text) >= 80, 'website reply is unexpectedly short'
          assert meta.get('modelId') == 'openai/gpt-5.6-sol'
          assert meta.get('modelAttempts') in (1, 2)
          assert meta.get('version') == 'hera-website-concierge-adapter-1.0.1'
          assert done.get('ok') is True
          assert done.get('automaticWhatsAppSendAllowed') is False
          assert done.get('timelyWriteAllowed') is False

          summary = Path('/tmp/proof-summary.json')
          summary.write_text(json.dumps({
              'result': 'PASS',
              'replyId': meta.get('replyId'),
              'modelId': meta.get('modelId'),
              'modelAttempts': meta.get('modelAttempts'),
              'replyCharacters': len(text),
              'automaticWhatsAppSendAllowed': done.get('automaticWhatsAppSendAllowed'),
              'timelyWriteAllowed': done.get('timelyWriteAllowed'),
          }, indent=2))
          print(summary.read_text())
          PY
          echo '## Website Concierge public proof: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/proof-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
