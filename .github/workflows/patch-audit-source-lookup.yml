name: Patch audit source lookup

on:
  push:
    branches:
      - feat/hera-ai-receptionist-foundation
    paths:
      - scripts/patch-audit-source-lookup.mjs
      - .github/workflows/patch-audit-source-lookup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hera-ai-receptionist-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch document-key-aware audit lookup
        run: node scripts/patch-audit-source-lookup.mjs
      - name: Verify patch
        run: |
          grep -q 'sourceIds.includes(String(doc.document_key))' scripts/audit-pricing-backlog.ts
          git diff --check
      - name: Remove patcher and commit corrected audit
        run: |
          rm scripts/patch-audit-source-lookup.mjs
          rm .github/workflows/patch-audit-source-lookup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make pricing audit document-key aware"
          git push origin HEAD:feat/hera-ai-receptionist-foundation
