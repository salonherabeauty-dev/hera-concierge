name: Refine automatic handoff precedence

# One-shot verifier and commit workflow for the isolated automatic-handoff branch.
on:
  push:
    branches:
      - feat/automatic-human-handoff
    paths:
      - scripts/refine-handoff-precedence.py
      - .github/workflows/refine-handoff-precedence.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automatic-human-handoff
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply precedence refinement
        run: python scripts/refine-handoff-precedence.py
      - name: Install locked dependencies
        run: npm ci
      - name: Strict type check and complete automated suite
        run: npm test
      - name: Credential scan
        run: npm run credential:scan
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve highest-consequence automatic handoff routing"
          git push origin HEAD:feat/automatic-human-handoff
