name: Harden fresh inbound side-effect order

on:
  push:
    branches:
      - fix/fresh-inbound-priority-drain
    paths:
      - scripts/apply-risk-order-hardening.mjs
      - .github/workflows/harden-fresh-inbound-risk-order.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fresh-inbound-priority-drain
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply chronology-before-risk patch
        run: node scripts/apply-risk-order-hardening.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Strict checks and complete suite
        run: npm test
      - name: Credential scan
        run: npm run credential:scan
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify exact ordering and clean change scope
        run: |
          grep -q 'before_operational_side_effects' src/worker.ts
          git diff --check
      - name: Remove one-time patcher and workflow, then commit
        run: |
          rm scripts/apply-risk-order-hardening.mjs
          rm .github/workflows/harden-fresh-inbound-risk-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Check supersession before changing conversation risk"
          git push origin HEAD:fix/fresh-inbound-priority-drain
