name: Apply Stage 2 action authority to worker
# One-time workflow; it removes itself after successful verification.

on:
  push:
    branches:
      - feat/stage2-knowledge-action-authority
    paths:
      - .github/workflows/apply-stage2-worker-authority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage2-knowledge-action-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch the exact final authority gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/worker.ts")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one target, found {count}")
              text = text.replace(old, new)

          replace_once(
              'import { detectSupportedClientLocale } from "./policy/locale.js";',
              '''import {
            ACTION_AUTHORITY_POLICY_VERSION,
            assessActionAuthority,
          } from "./policy/actionAuthority.js";
          import { detectSupportedClientLocale } from "./policy/locale.js";''',
              "action authority import",
          )

          initial_verifier = "  const initialFinalVerification = await verifyFinalClientReply({"
          replace_once(
              initial_verifier,
              '''  const draftActionAuthority = assessActionAuthority({
            reply: draftFinalReply,
            decision,
            policy,
            handoff,
            risk: policy.risk,
          });
          const initialFinalVerification = await verifyFinalClientReply({''',
              "draft action authority",
          )

          delivery_line = (
              "  const deliveryEligible = finalQuality.passed && "
              "finalVerification.approved;"
          )
          replace_once(
              delivery_line,
              '''  const finalActionAuthority = assessActionAuthority({
            reply: finalReply,
            decision,
            policy,
            handoff,
            risk: policy.risk,
          });
          const deliveryEligible =
            finalQuality.passed &&
            finalVerification.approved &&
            finalActionAuthority.passed;''',
              "final action authority and delivery eligibility",
          )

          replace_once(
              "      finalQualityPolicyVersion: FINAL_RESPONSE_QUALITY_POLICY_VERSION,\n      policy,",
              "      finalQualityPolicyVersion: FINAL_RESPONSE_QUALITY_POLICY_VERSION,\n      actionAuthorityPolicyVersion: ACTION_AUTHORITY_POLICY_VERSION,\n      policy,",
              "policy version evidence",
          )
          replace_once(
              "      deterministicDraftQuality,\n      initialFinalVerification:",
              "      deterministicDraftQuality,\n      draftActionAuthority,\n      initialFinalVerification:",
              "draft authority evidence",
          )
          replace_once(
              "      finalReply,\n      finalQuality,\n      finalVerification:",
              "      finalReply,\n      finalQuality,\n      finalActionAuthority,\n      finalVerification:",
              "final authority evidence",
          )
          replace_once(
              "        deterministicIssues: finalQuality.issues,\n        finalVerifierApproved: finalVerification.approved,",
              '''        deterministicIssues: finalQuality.issues,
                actionAuthorityPassed: finalActionAuthority.passed,
                actionAuthorityIssues: finalActionAuthority.issues,
                actionAuthorityPolicyVersion: ACTION_AUTHORITY_POLICY_VERSION,
                finalVerifierApproved: finalVerification.approved,''',
              "blocked response authority evidence",
          )

          replace_once(
              "  if (!fallbackQuality.passed) {",
              '''  const fallbackActionAuthority = assessActionAuthority({
            reply: fallbackReply,
            decision: fallbackDecision,
            policy: fallbackPolicy,
            handoff: fallbackHandoff,
            risk: "amber",
          });
          if (!fallbackQuality.passed || !fallbackActionAuthority.passed) {''',
              "fallback action authority",
          )
          replace_once(
              '    throw new Error("Dead-letter fallback failed Hera’s deterministic quality gate");',
              '''    throw new Error(
              "Dead-letter fallback failed Hera’s deterministic quality or action-authority gate",
            );''',
              "fallback error",
          )
          replace_once(
              "    humanHandoffCreated: true,\n  });",
              '''    humanHandoffCreated: true,
            actionAuthorityPolicyVersion: ACTION_AUTHORITY_POLICY_VERSION,
            actionAuthorityPassed: fallbackActionAuthority.passed,
          });''',
              "fallback audit evidence",
          )

          path.write_text(text)
          PY
      - name: Verify repository
        run: |
          npm ci
          npm test
          npm run credential:scan
          npm audit --omit=dev --audit-level=high
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/apply-stage2-worker-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.ts .github/workflows/apply-stage2-worker-authority.yml
          git commit -m "Enforce action authority on the exact final client reply"
          git push origin feat/stage2-knowledge-action-authority
