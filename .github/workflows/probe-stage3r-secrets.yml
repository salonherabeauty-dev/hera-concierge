name: Probe Stage 3-R secret availability

on:
  push:
    branches:
      - ops/stage3r-github-secret-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Report secret presence without values
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          names = [
              'SUPABASE_ACCESS_TOKEN',
              'SUPABASE_DB_PASSWORD',
              'SUPABASE_PROJECT_REF',
              'SUPABASE_URL',
              'SUPABASE_SERVICE_ROLE_KEY',
              'AI_GATEWAY_API_KEY',
              'VERCEL_TOKEN',
          ]
          print('HERA_STAGE3R_GITHUB_SECRET_PRESENCE', json.dumps({
              name: bool(os.environ.get(name, '').strip()) for name in names
          }))
          PY
