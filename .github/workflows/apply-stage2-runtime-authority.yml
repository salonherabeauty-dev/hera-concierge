name: Apply Stage 2 runtime authority

on:
  push:
    branches:
      - feat/stage-2-knowledge-action-authority

permissions:
  contents: write

concurrency:
  group: apply-stage2-runtime-authority
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage-2-knowledge-action-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Integrate deterministic knowledge and action authority
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/knowledge/search.ts')
          text = path.read_text()

          action_import = 'import { renderActionAuthorityPrompt } from "../governance/actionAuthority.js";\n'
          knowledge_import = 'import { orderKnowledgeByAuthority } from "../governance/knowledgeAuthority.js";\n'
          anchor = 'import type { KnowledgeResult } from "../types.js";\n'
          if action_import not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('knowledge import anchor not unique')
              text = text.replace(anchor, anchor + action_import + knowledge_import)

          old_static = '''const STATIC_SECTIONS = [
            ...splitApprovedKnowledge(HERA_OPERATOR_POLICIES),
            ...splitApprovedKnowledge(),
          ];'''
          new_static = '''const STATIC_SECTIONS = [
            ...splitApprovedKnowledge(
              `${HERA_OPERATOR_POLICIES}\\n\\n${renderActionAuthorityPrompt()}`,
            ),
            ...splitApprovedKnowledge(),
          ];'''
          if old_static in text:
              text = text.replace(old_static, new_static)
          elif 'renderActionAuthorityPrompt()' not in text:
              raise SystemExit('static knowledge integration anchor not found')

          old_return = '''  return [...merged.values()].sort((a, b) => b.score - a.score).slice(0, limit);'''
          new_return = '''  return orderKnowledgeByAuthority([...merged.values()], limit);'''
          if old_return in text:
              text = text.replace(old_return, new_return)
          elif new_return not in text:
              raise SystemExit('knowledge ordering return anchor not found')

          path.write_text(text)
          PY
      - name: Verify repository
        run: |
          npm ci
          npm test
          npm run credential:scan
          npm audit --omit=dev --audit-level=high
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/apply-stage2-runtime-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/knowledge/search.ts .github/workflows/apply-stage2-runtime-authority.yml
          git commit -m "Integrate Stage 2 knowledge and action authority at runtime"
          git push origin HEAD:feat/stage-2-knowledge-action-authority
