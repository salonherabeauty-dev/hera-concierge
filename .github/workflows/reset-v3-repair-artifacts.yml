name: Generate Reset v3 recovery artifacts

on:
  push:
    branches:
      - repair/reset-v3-direct-openai-recovery

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/reset-v3-direct-openai-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact UI and regression-test updates
        run: python .github/scripts/apply_reset_v3_repair.py
      - name: Refresh locked dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Verify generated repair
        run: npm run typecheck && npm run build && npm run test:unit
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- public/command-centre/reset-workspace.js public/command-centre/reset-workspace.css tests/receptionistResetV3Contract.test.ts package-lock.json; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/command-centre/reset-workspace.js public/command-centre/reset-workspace.css tests/receptionistResetV3Contract.test.ts package-lock.json
          git commit -m "chore: apply verified Reset v3 recovery artifacts"
          git push origin HEAD:repair/reset-v3-direct-openai-recovery
