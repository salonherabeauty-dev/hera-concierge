name: Harden atomic claim and model fallback

on:
  push:
    branches:
      - fix/fresh-inbound-priority-drain

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fresh-inbound-priority-drain
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply migration-free atomic claim and model fallback hardening
        run: node scripts/remove-ddl-and-harden-model-fallback.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Strict type check, build and complete automated suite
        run: npm test
      - name: Credential scan
        run: npm run credential:scan
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify clean implementation
        run: |
          git diff --check
          test ! -f supabase/migrations/20260825000000_prioritize_fresh_inbound_jobs.sql
          grep -q 'claimJobsByIds' src/db/repository.ts
          grep -q 'generateWithStructuredFallback' src/ai/receptionist.ts
          grep -q 'drainReceptionistForJobs' api/whatsapp/360dialog.ts
      - name: Remove one-time patcher and workflow, then commit verified implementation
        run: |
          rm scripts/remove-ddl-and-harden-model-fallback.mjs
          rm .github/workflows/harden-atomic-claim-and-model-fallback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use atomic targeted claims and bounded structured-model fallback'
          git push origin HEAD:fix/fresh-inbound-priority-drain
