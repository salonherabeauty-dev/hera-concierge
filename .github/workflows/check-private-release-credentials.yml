name: Check private release credential availability

on:
  push:
    branches:
      - diagnostic/website-concierge-production-env-readiness
    paths:
      - ".github/workflows/check-private-release-credentials.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL != '' }}
      HAS_SUPABASE_SERVICE_ROLE_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
      HAS_OPENAI_API_KEY_SECRET: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - name: Report presence booleans only
        run: |
          set -euo pipefail
          printf 'VERCEL_TOKEN_PRESENT=%s\n' "$HAS_VERCEL_TOKEN"
          printf 'SUPABASE_URL_GITHUB_SECRET_PRESENT=%s\n' "$HAS_SUPABASE_URL_SECRET"
          printf 'SUPABASE_SERVICE_ROLE_GITHUB_SECRET_PRESENT=%s\n' "$HAS_SUPABASE_SERVICE_ROLE_SECRET"
          printf 'OPENAI_API_KEY_GITHUB_SECRET_PRESENT=%s\n' "$HAS_OPENAI_API_KEY_SECRET"
