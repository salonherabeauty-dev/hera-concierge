name: Refine fresh inbound priority drain

on:
  push:
    branches:
      - fix/fresh-inbound-priority-drain

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fresh-inbound-priority-drain
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply chronology and dead-letter refinements
        run: node scripts/refine-fresh-inbound-priority-fix.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Strict type check, build and complete automated suite
        run: npm test
      - name: Credential scan
        run: npm run credential:scan
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify patch integrity
        run: |
          git diff --check
          grep -q 'dead_letter_fallback_suppressed' src/worker.ts
          grep -q 'distinct on (requested_id)' supabase/migrations/20260825000000_prioritize_fresh_inbound_jobs.sql
      - name: Remove one-time patcher and workflow, then commit verified refinements
        run: |
          rm scripts/refine-fresh-inbound-priority-fix.mjs
          rm .github/workflows/refine-fresh-inbound-priority.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden fresh job chronology and suppress stale dead-letter fallbacks'
          git push origin HEAD:fix/fresh-inbound-priority-drain
