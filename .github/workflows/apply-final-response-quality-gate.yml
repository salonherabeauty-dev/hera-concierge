name: Apply final response quality gate

on:
  push:
    branches:
      - feat/final-response-quality-gate
    paths:
      - scripts/apply_final_response_quality_gate.py
      - scripts/run_final_response_quality_gate.py
      - .github/workflows/apply-final-response-quality-gate.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-response-quality-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply system-wide final response quality gate
        run: python3 scripts/run_final_response_quality_gate.py
      - name: Install locked dependencies
        run: npm ci
      - name: Strict type check and complete automated suite
        run: npm test
      - name: Credential scan
        run: npm run credential:scan
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify clean patch
        run: git diff --check
      - name: Remove one-time patcher and commit verified changes
        run: |
          rm scripts/apply_final_response_quality_gate.py
          rm scripts/run_final_response_quality_gate.py
          rm .github/workflows/apply-final-response-quality-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add system-wide final response quality gate"
          git push origin HEAD:feat/final-response-quality-gate
