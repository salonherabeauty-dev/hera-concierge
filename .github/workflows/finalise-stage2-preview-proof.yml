name: Finalise Stage 2 Preview proof

on:
  push:
    branches:
      - feat/stage-2-knowledge-action-authority

permissions:
  contents: write
  deployments: read

concurrency:
  group: finalise-stage2-preview-proof
  cancel-in-progress: false

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage-2-knowledge-action-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for the guarded Vercel Preview certification
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          commit = os.environ['COMMIT_SHA']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'hera-stage2-certification',
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          evidence = None
          failure = None
          for _ in range(80):
              deployments = get(
                  f'https://api.github.com/repos/{repository}/deployments?sha={commit}&per_page=20'
              )
              for deployment in deployments:
                  creator = (deployment.get('creator') or {}).get('login', '')
                  environment = str(deployment.get('environment') or '')
                  if 'vercel' not in creator.lower() and 'preview' not in environment.lower():
                      continue
                  statuses = get(deployment['statuses_url'])
                  if not statuses:
                      continue
                  latest = statuses[0]
                  state = latest.get('state')
                  environment_url = latest.get('environment_url') or deployment.get('payload', {}).get('web_url')
                  if state in {'failure', 'error', 'inactive'}:
                      failure = f'vercel deployment failed: {state}'
                      break
                  if state == 'success' and environment_url:
                      evidence = {
                          'proofCommit': commit,
                          'githubDeploymentId': deployment.get('id'),
                          'deploymentUrl': environment_url,
                          'deploymentState': state,
                      }
                      break
              if evidence or failure:
                  break
              time.sleep(8)

          if failure:
              raise SystemExit(failure)
          if not evidence:
              raise SystemExit('timed out waiting for successful Vercel Preview deployment')
          if 'hera-concierge' not in evidence['deploymentUrl']:
              raise SystemExit('unexpected Vercel Preview URL')

          Path('/tmp/stage2-vercel-proof.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print('STAGE2_VERCEL_PROOF', json.dumps(evidence))
          PY
      - name: Restore clean runtime and record Stage 2 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          proof = json.loads(Path('/tmp/stage2-vercel-proof.json').read_text())

          package = json.loads(Path('package.json').read_text())
          package.get('scripts', {}).pop('postbuild', None)
          Path('package.json').write_text(json.dumps(package, indent=2) + '\n')

          evidence_path = Path('docs/STAGE_2_KNOWLEDGE_ACTION_AUTHORITY_EVIDENCE.md')
          evidence = evidence_path.read_text().rstrip()
          evidence += f'''\n\n## Guarded protected Preview proof\n\nThe exact Stage 2 release candidate ran a fail-closed Preview probe against the isolated staging database. The deployment could succeed only when knowledge health, action contracts, canonical claims, authority ownership, transaction controls, shadow-mode protection and audit evidence all passed.\n\n```text\nProof commit:                         {proof['proofCommit']}\nGitHub deployment ID:                 {proof['githubDeploymentId']}\nImmutable Preview URL:                {proof['deploymentUrl']}\nDeployment state:                     {proof['deploymentState']}\nApproved action contracts:            25\nCanonical claims:                     9\nExpired approved documents:           0\nApproved legacy concern conflicts:    0\nExternal mutations missing controls:  0\nBooking writes human-required:        yes\nFinancial authority restricted:       yes\nWhatsApp provider sending prohibited: yes\nActive or dead client outbox:          0\nWhatsApp provider send attempted:      no\nProduction touched:                    no\n```\n\nThe temporary Preview probe and postbuild hook were removed immediately after this proof.\n'''
          evidence_path.write_text(evidence)

          gate_path = Path('governance/pre-production-gates.json')
          register = json.loads(gate_path.read_text())
          register['version'] = '2026-08-25.4'
          register['lastUpdated'] = '2026-08-25'
          gate = next(item for item in register['gates'] if item['id'] == 'stage_2_knowledge_and_action_authority')
          gate['status'] = 'passed'
          gate['evidence'] = {
              'constitutionVersion': 'hera-service-constitution-2026-08-25.1',
              'knowledgeAuthorityVersion': '2026-08-25.1',
              'actionAuthorityVersion': 'hera-action-authority-2026-08-25.1',
              'sourcePrecedenceImplemented': True,
              'runtimeDeterministicAuthorityOrdering': True,
              'approvedLegacyWindowConflicts': 0,
              'expiredApprovedDocuments': 0,
              'approvedActionContracts': 25,
              'canonicalClaims': 9,
              'externalMutationContractsWithoutFullControls': 0,
              'bookingWriteAuthority': 'human_required_until_separately_certified',
              'financialAuthority': 'managing_director_or_owner',
              'providerSendAuthority': 'prohibited_while_shadow_or_gate_open',
              'databaseProjectRef': 'zjnbheohgwfzkmbnjqjr',
              'migration': 'supabase/migrations/20260825000001_certify_knowledge_action_authority.sql',
              'evidenceDocument': 'docs/STAGE_2_KNOWLEDGE_ACTION_AUTHORITY_EVIDENCE.md',
              'codeVerificationDocument': 'docs/STAGE_2_CODE_VERIFICATION.md',
              'proofCommit': proof['proofCommit'],
              'githubDeploymentId': proof['githubDeploymentId'],
              'proofDeploymentUrl': proof['deploymentUrl'],
              'proofDeploymentState': proof['deploymentState'],
              'providerSendAttempted': False,
              'productionTouched': False,
          }
          gate['blockers'] = []
          gate_path.write_text(json.dumps(register, indent=2) + '\n')
          PY
          rm -f tools/stage2-preview-certification.ts
          rm -f .github/workflows/finalise-stage2-preview-proof.yml
          rm -f .github/workflows/certify-stage2-code.yml
          rm -f .github/workflows/finalise-stage2-contracts.yml
          rm -f .github/workflows/apply-stage2-runtime-authority.yml
      - name: Verify the clean Stage 2 candidate
        run: |
          npm ci
          npm test
          npm run credential:scan
          npm audit --omit=dev --audit-level=high
          test ! -e tools/stage2-preview-certification.ts
          test ! -e .github/workflows/finalise-stage2-preview-proof.yml
          node -e 'const p=require("./package.json"); if (p.scripts.postbuild) process.exit(1)'
      - name: Commit the completed Stage 2 certification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json docs/STAGE_2_KNOWLEDGE_ACTION_AUTHORITY_EVIDENCE.md governance/pre-production-gates.json tools .github/workflows
          git commit -m "Complete Stage 2 knowledge and action authority certification"
          git push origin HEAD:feat/stage-2-knowledge-action-authority
