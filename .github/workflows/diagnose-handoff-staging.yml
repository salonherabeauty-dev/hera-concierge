name: One-time staging handoff diagnosis

on:
  push:
    branches:
      - feat/hera-ai-receptionist-foundation
    paths:
      - scripts/diagnose-handoff-staging.mjs
      - .github/workflows/diagnose-handoff-staging.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hera-ai-receptionist-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Inspect and repair isolated staging schema when authorised
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p docs
          {
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            node scripts/diagnose-handoff-staging.mjs
          } | tee docs/STAGING_HANDOFF_DIAGNOSTIC.txt
      - name: Persist only the sanitised diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STAGING_HANDOFF_DIAGNOSTIC.txt
          if git diff --cached --quiet; then
            echo "No diagnostic change to commit."
            exit 0
          fi
          git commit -m "Record sanitised staging handoff diagnosis"
          git pull --rebase origin feat/hera-ai-receptionist-foundation
          git push origin HEAD:feat/hera-ai-receptionist-foundation
