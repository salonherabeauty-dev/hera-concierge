name: Verify corrected final reply

on:
  push:
    branches:
      - feat/final-response-quality-gate
    paths:
      - scripts/verify_corrected_final_reply.py
      - .github/workflows/verify-corrected-final-reply.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-response-quality-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact final-reply re-verification and protected fallback
        run: python3 scripts/verify_corrected_final_reply.py
      - name: Install locked dependencies
        run: npm ci
      - name: Strict type check and complete automated suite
        run: npm test
      - name: Credential scan
        run: npm run credential:scan
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify clean patch
        run: git diff --check
      - name: Remove one-time patcher and commit verified changes
        run: |
          rm scripts/verify_corrected_final_reply.py
          rm .github/workflows/verify-corrected-final-reply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Re-verify corrected client replies before delivery"
          git push origin HEAD:feat/final-response-quality-gate
